<svg width="850" height="140" viewBox="0 0 850 140" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer Card with dark background and border -->
  <rect width="850" height="140" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  
  <!-- Subtle Grid Pattern for engineering aesthetic -->
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  
  <rect width="850" height="140" rx="10" fill="url(#grid)" />

  <!-- Top Terminal Bar -->
  <rect x="1" y="1" width="848" height="34" rx="9" fill="#161b22" />
  <rect x="1" y="24" width="848" height="11" fill="#161b22" />
  <line x1="1" y1="35" x2="849" y2="35" stroke="#30363d" stroke-width="1"/>
  
  <!-- Terminal Dots (Monochrome / Shades of Grey) -->
  <circle cx="22" cy="18" r="4.5" fill="#484f58"/>
  <circle cx="38" cy="18" r="4.5" fill="#30363d"/>
  <circle cx="54" cy="18" r="4.5" fill="#21262d"/>
  
  <!-- Terminal Title -->
  <text x="425" y="22" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Courier New', monospace" font-size="11" font-weight="500" letter-spacing="0.1em" text-anchor="middle">anuruddha@production-sys:~</text>

  <!-- Main Content -->
  <!-- Name -->
  <text x="425" y="80" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif" font-size="26" font-weight="700" letter-spacing="0.05em">ANURUDDHA PRATAP SINGH</text>
  
  <!-- Title / Specialization -->
  <text x="425" y="108" text-anchor="middle" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', monospace" font-size="14" font-weight="500" letter-spacing="0.08em">SOFTWARE ENGINEER</text>
</svg>

<svg width="850" height="200" viewBox="0 0 850 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer Card with dark background and border -->
  <rect width="850" height="200" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  
  <!-- Subtle Grid Pattern for engineering aesthetic -->
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.04"/>
    </pattern>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#30363d" stop-opacity="0"/>
      <stop offset="50%" stop-color="#8b949e" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#30363d" stop-opacity="0"/>
    </linearGradient>
  </defs>
  
  <rect width="850" height="200" rx="10" fill="url(#grid)" />

  <!-- Top Terminal Bar -->
  <rect x="1" y="1" width="848" height="34" rx="9" fill="#161b22" />
  <rect x="1" y="24" width="848" height="11" fill="#161b22" />
  <line x1="1" y1="35" x2="849" y2="35" stroke="#30363d" stroke-width="1"/>
  
  <!-- Terminal Dots (Monochrome / Shades of Grey) -->
  <circle cx="22" cy="18" r="4.5" fill="#484f58"/>
  <circle cx="38" cy="18" r="4.5" fill="#30363d"/>
  <circle cx="54" cy="18" r="4.5" fill="#21262d"/>
  
  <!-- Terminal Title -->
  <text x="425" y="22" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Courier New', monospace" font-size="11" font-weight="500" letter-spacing="0.1em" text-anchor="middle">anuruddha@production-sys:~</text>

  <!-- Main Content -->
  <!-- Name -->
  <text x="40" y="82" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif" font-size="26" font-weight="700" letter-spacing="0.05em">ANURUDDHA PRATAP SINGH</text>
  
  <!-- Title / Specialization -->
  <text x="40" y="108" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', monospace" font-size="13" font-weight="500" letter-spacing="0.08em">SOFTWARE ENGINEER  •  SYSTEMS &amp; ARCHITECTURE  •  OPEN SOURCE</text>
  
  <!-- Sleek Divider -->
  <line x1="40" y1="126" x2="810" y2="126" stroke="url(#lineGrad)" stroke-width="1"/>

  <!-- Command Line / Spec Lines -->
  <text x="40" y="152" fill="#8b949e" font-family="'SF Mono', 'Fira Code', 'Courier New', monospace" font-size="12" font-weight="500">
    <tspan fill="#6e7681">$</tspan> <tspan fill="#c9d1d9">core.focus</tspan> <tspan fill="#6e7681">-&gt;</tspan> <tspan fill="#f0f6fc">Low-Level Design (LLD)</tspan> <tspan fill="#484f58">|</tspan> <tspan fill="#f0f6fc">Enterprise Java</tspan> <tspan fill="#484f58">|</tspan> <tspan fill="#f0f6fc">Clean Architecture</tspan>
  </text>
  
  <text x="40" y="174" fill="#8b949e" font-family="'SF Mono', 'Fira Code', 'Courier New', monospace" font-size="12" font-weight="500">
    <tspan fill="#6e7681">$</tspan> <tspan fill="#c9d1d9">core.ethos</tspan> <tspan fill="#6e7681">-&gt;</tspan> <tspan fill="#8b949e">"Disciplined engineering, deterministic systems &amp; continuous mastery"</tspan>
  </text>

  <!-- Status indicator on right -->
  <g transform="translate(680, 64)">
    <rect width="130" height="26" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <circle cx="14" cy="13" r="3.5" fill="#f0f6fc"/>
    <text x="25" y="17" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="11" font-weight="600" letter-spacing="0.03em">OPEN TO BUILD</text>
  </g>
</svg>
